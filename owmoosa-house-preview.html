<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#191713"><title>OWMOOSA — The House</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&display=swap');
:root{color-scheme:dark;--ink:#eee5d3;--muted:#c1b39a;--gold:#d5b879;--night:#191713;--x:0;--y:0;--ease:cubic-bezier(.2,.75,.25,1)}*{box-sizing:border-box}body{margin:0;background:var(--night);color:var(--ink);font-family:'Gowun Batang',Georgia,serif;overflow:hidden}button{font:inherit;color:inherit}.frame{position:relative;height:100svh;min-height:550px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 51% 42%,#716148 0,#3e3426 34%,#211e19 76%)}.scene{position:absolute;inset:-3%;transform-style:preserve-3d;transition:transform .25s var(--ease);transform:perspective(1100px) rotateY(calc(var(--x)*-1.1deg)) rotateX(calc(var(--y)*.75deg)) scale(1.035)}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 18%,#100f0de0 100%);z-index:8;pointer-events:none}.wall{position:absolute;inset:0 0 28%;background:linear-gradient(90deg,#29241c,#554532 18%,#63513a 50%,#493b2b 82%,#27221b);box-shadow:inset 0 -4px 35px #100e0a}.wall:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7%,#e1c68b09 7.1% 7.25%,transparent 7.4% 23%)}.ceiling{position:absolute;left:-5%;right:-5%;top:-16%;height:24%;background:linear-gradient(#191714,#393024);clip-path:polygon(0 0,100% 0,91% 100%,9% 100%);border-bottom:3px solid #90764c}.floor{position:absolute;inset:71% -10% -15%;background:repeating-linear-gradient(90deg,transparent 0 12%,#c2985813 12.2% 12.4%),repeating-linear-gradient(0deg,#211b14 0 4%,#35291d 4.2% 4.5%,#211b14 4.8% 11%);transform:perspective(430px) rotateX(22deg);transform-origin:top;box-shadow:inset 0 24px 45px #120f0a}.trim{position:absolute;left:8%;right:8%;top:11%;bottom:25%;border:2px solid #b69a6550;box-shadow:inset 0 0 0 8px #1b1813,inset 0 0 0 10px #ab895346;pointer-events:none}.lamp{position:absolute;z-index:2;left:50%;top:3%;width:2px;height:16%;background:#17140f;transform:translateX(-50%)}.lamp:after{content:"";position:absolute;top:90%;left:-42px;width:86px;height:45px;border-radius:5px 5px 42px 42px;background:linear-gradient(#e8d5a8,#9b7941);box-shadow:0 12px 50px 30px #e0b96032}.glow{position:absolute;z-index:1;left:50%;top:14%;width:38vw;height:54vh;transform:translateX(-50%);background:radial-gradient(ellipse,#e2bb6940,transparent 70%);pointer-events:none}.brand{position:absolute;z-index:10;top:30px;left:clamp(22px,5vw,76px);font:500 14px 'DM Mono',monospace;letter-spacing:.23em}.brand span{color:var(--gold)}.top-note{position:absolute;z-index:10;top:34px;right:clamp(22px,5vw,76px);font:10px 'DM Mono',monospace;letter-spacing:.14em;color:#d6c8ac}.copy{position:absolute;z-index:10;left:clamp(25px,8vw,125px);top:35%;max-width:490px;text-shadow:0 2px 35px #120f0c}.eyebrow{font:10px 'DM Mono',monospace;color:var(--gold);letter-spacing:.22em}.copy h1{font-size:clamp(52px,8.1vw,112px);font-weight:400;line-height:.98;letter-spacing:-.055em;margin:18px 0 20px}.copy p{font-size:15px;color:#ded2bd;line-height:1.9;margin:0 0 30px}.enter,.door-button{cursor:pointer;background:transparent;border:1px solid #dac28b85;padding:13px 18px;letter-spacing:.04em;transition:background .3s,border-color .3s,transform .3s}.enter:hover,.door-button:hover{background:#d5b87919;border-color:var(--gold);transform:translateY(-2px)}.enter span{color:var(--gold);margin-left:24px}.entry-door{position:absolute;right:15%;top:17%;height:72%;width:min(30vw,380px);min-width:230px;z-index:3;transform:translate3d(calc(var(--x)*-10px),calc(var(--y)*-7px),0);transition:transform .25s var(--ease);filter:drop-shadow(0 24px 20px #100e0b99)}.entry-door .outer{position:absolute;inset:0;background:linear-gradient(90deg,#241b14,#805d36 9%,#4a3422 13%,#77563a 50%,#362619 88%,#1f1913);border:5px solid #9b7a4d;box-shadow:inset 0 0 0 8px #2a2118,inset 0 0 0 11px #ac89504d}.entry-door .panel{position:absolute;inset:8% 14%;border:2px solid #17130f99;box-shadow:inset 0 0 0 6px #ba96501c,inset 0 0 0 8px #17130f88}.panel:before,.panel:after{content:"";position:absolute;left:0;right:0;border:2px solid #17130f88;height:24%}.panel:before{top:5%}.panel:after{bottom:5%}.knob{position:absolute;right:14%;top:51%;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6dfa1,#92703a 65%,#342518);box-shadow:0 0 20px #edc46c70}.door-plaque{position:absolute;left:50%;top:43%;transform:translateX(-50%);font:10px 'DM Mono',monospace;letter-spacing:.18em;color:#d6bc80;white-space:nowrap}.living{display:none}.is-inside .living{display:block}.is-inside .entry-copy{display:none}.is-inside .entry-door{opacity:.15;transform:translate3d(-22vw,3vh,-70px) scale(.76);pointer-events:none}.room-label{position:absolute;z-index:10;left:50%;top:20%;transform:translateX(-50%);text-align:center;white-space:nowrap}.room-label h1{font-weight:400;font-size:clamp(36px,5vw,65px);margin:11px 0}.room-label p{margin:0;color:#d2c4aa;font-size:13px}.living-note{position:absolute;z-index:10;bottom:8%;left:50%;transform:translateX(-50%);font:10px 'DM Mono',monospace;letter-spacing:.14em;color:#d2c4aa;white-space:nowrap}.doors{position:absolute;z-index:5;left:12%;right:12%;top:41%;height:46%;display:flex;justify-content:space-around;align-items:end;gap:2.2%;transform:translate3d(calc(var(--x)*12px),calc(var(--y)*7px),0);transition:transform .3s var(--ease)}.room-door{position:relative;flex:1;height:100%;max-width:220px;min-width:0;cursor:pointer;transform:perspective(700px) rotateY(calc(var(--x)*-.35deg));transition:transform .35s var(--ease),filter .35s;filter:drop-shadow(0 16px 14px #100d0990)}.room-door:nth-child(2),.room-door:nth-child(3){height:90%}.room-door:hover{transform:translateY(-9px) scale(1.025);filter:drop-shadow(0 10px 28px #d5b87950)}.door-arch{position:absolute;inset:0;border:7px solid #987b4e;background:linear-gradient(90deg,#191713,#30271d 14%,#654d30 50%,#201b15 90%);border-radius:100px 100px 0 0;box-shadow:inset 0 0 0 3px #17140f,inset 0 0 35px #d5a64a27}.door-arch:before{content:"";position:absolute;inset:14% 15% 9%;border:1px solid #c4a66a65;background:linear-gradient(140deg,#e3bb6022,transparent 60%)}.door-arch:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#d9b866;right:18%;top:55%;box-shadow:0 0 16px 5px #e1bd6866}.door-tag{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);white-space:nowrap;text-align:center;text-shadow:0 2px 8px #000;font-size:clamp(12px,1.2vw,16px)}.door-tag small{display:block;color:var(--gold);font:9px 'DM Mono',monospace;letter-spacing:.14em;margin-bottom:7px}.room-detail{position:absolute;z-index:12;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#776044ed,#211d17f7 75%);backdrop-filter:blur(5px)}.room-detail.active{display:flex;animation:arrive .7s var(--ease) both}.detail-inner{max-width:600px;padding:28px}.detail-inner h2{font-weight:400;font-size:clamp(42px,7vw,82px);margin:15px 0}.detail-inner p{line-height:1.9;color:#d7cbb5}.gallery-objects{display:flex;gap:14px;justify-content:center;margin:25px auto}.gallery-objects i{display:block;width:86px;height:105px;border:1px solid #c7a976;background:linear-gradient(145deg,#bf9f6840,#242019);box-shadow:0 8px 28px #0007}.gallery-objects i:nth-child(2){transform:translateY(-12px);background:linear-gradient(140deg,#bd905650,#26201a)}.gallery-objects i:nth-child(3){background:linear-gradient(140deg,#d3b17c40,#22201b)}.back{position:absolute;z-index:13;left:clamp(22px,5vw,76px);bottom:34px;background:none;border:0;color:#e3d7c0;cursor:pointer;font:11px 'DM Mono',monospace;letter-spacing:.1em}.back b{color:var(--gold);font-size:19px;font-weight:400;margin-right:10px}.room-back{display:none}.room-back.show{display:block}.status{position:absolute;z-index:10;right:clamp(22px,5vw,76px);bottom:37px;color:#b8aa90;font:9px 'DM Mono',monospace;letter-spacing:.12em}@keyframes arrive{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}@media(max-width:700px){.frame{min-height:500px}.scene{inset:-1%}.entry-door{right:7%;top:25%;height:58%;min-width:185px}.copy{top:27%;left:7%;max-width:55%}.copy h1{font-size:clamp(44px,12vw,74px)}.copy p{font-size:12px}.top-note{top:auto;bottom:36px}.doors{left:5%;right:5%;top:48%;height:35%;gap:2%}.room-door{max-width:none}.door-arch{border-width:5px}.room-tag{font-size:10px}.room-label{top:16%}.room-label p{font-size:11px}.living-note{bottom:13%;font-size:8px}.status{bottom:17px;left:50%;right:auto;transform:translateX(-50%)}.is-inside .entry-door{transform:translate3d(-36vw,10vh,-70px) scale(.62)}.brand{top:20px}.trim{left:3%;right:3%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="frame" id="frame"><div class="scene" id="scene"><div class="ceiling"></div><div class="wall"></div><div class="trim"></div><div class="glow"></div><div class="lamp"></div><div class="floor"></div>
<div class="brand">OWM<span>OO</span>SA <span>®</span></div><div class="top-note">A HOUSE FOR CURIOSITY &nbsp; / &nbsp; 2026</div>
<div class="entry-copy copy"><div class="eyebrow">A PERSONAL ARCHIVE IN SPACE</div><h1>문 너머의<br>OWMOOSA</h1><p>작은 호기심이 모여 하나의 집이 되었습니다.<br>문을 열고 천천히 둘러보세요.</p><button class="enter" id="enter">집 안으로 들어가기 <span>↗</span></button></div>
<div class="entry-door" id="entryDoor" aria-hidden="true"><div class="outer"><div class="panel"></div><div class="door-plaque">OWMOOSA</div><div class="knob"></div></div></div>
<section class="living" aria-label="거실"><div class="room-label"><div class="eyebrow">WELCOME HOME</div><h1>거실</h1><p>어느 문을 열어볼까요?</p></div><nav class="doors" aria-label="방 선택">
<button class="room-door" data-room="projects" aria-label="프로젝트 방"><span class="door-arch"></span><span class="door-tag"><small>01 / WORK</small>프로젝트</span></button>
<button class="room-door" data-room="gallery" aria-label="AI 작업 방"><span class="door-arch"></span><span class="door-tag"><small>02 / PLAY</small>AI 작업</span></button>
<button class="room-door" data-room="instagram" aria-label="기록 방"><span class="door-arch"></span><span class="door-tag"><small>03 / NOTES</small>기록</span></button>
<button class="room-door" data-room="future" aria-label="미래예측 방"><span class="door-arch"></span><span class="door-tag"><small>04 / TOMORROW</small>미래예측</span></button>
</nav><div class="living-note">문을 눌러 안으로 들어가기</div></section>
<section class="room-detail" id="detail" aria-live="polite"><div class="detail-inner" id="detailInner"></div></section>
<button class="back" id="back" hidden><b>←</b> 현관으로</button><button class="back room-back" id="roomBack"><b>←</b> 거실로</button><div class="status" id="status">01 — 현관</div></div></main>
<script>
const frame=document.querySelector('#frame'), detail=document.querySelector('#detail'), detailInner=document.querySelector('#detailInner'), statusText=document.querySelector('#status');let roomOpen=false;
const rooms={projects:{num:'01 / WORK ROOM',name:'프로젝트',desc:'생각에서 시작해 직접 만든 것들이 놓이는 방.\n작은 도구와 실험의 이야기를 살펴보세요.',objects:true},gallery:{num:'02 / AI ATELIER',name:'AI 작업실',desc:'AI와 함께 만든 이미지와 움직이는 장면을\n하나씩 전시하는 작은 갤러리입니다.',objects:true},instagram:{num:'03 / DAILY NOTES',name:'기록의 방',desc:'일상의 조각과 발견을 모아두는 공간.\n나중에 소셜 기록을 이곳에 이어 붙일 수 있어요.',objects:false},future:{num:'04 / TOMORROW',name:'미래예측',desc:'AI가 바꿔갈 내일에 대한 질문과 상상.\n지금의 생각을 벽에 걸어둡니다.',objects:false}};
document.querySelector('#enter').addEventListener('click',()=>{frame.classList.add('is-inside');document.querySelector('#back').hidden=false;statusText.textContent='02 — 거실'});
document.querySelector('#back').addEventListener('click',()=>{detail.classList.remove('active');document.querySelector('#roomBack').classList.remove('show');frame.classList.remove('is-inside');document.querySelector('#back').hidden=true;roomOpen=false;statusText.textContent='01 — 현관'});
document.querySelectorAll('.room-door').forEach(button=>button.addEventListener('click',()=>{const r=rooms[button.dataset.room];detailInner.innerHTML=`<div class="eyebrow">${r.num}</div><h2>${r.name}</h2>${r.objects?'<div class="gallery-objects" aria-hidden="true"><i></i><i></i><i></i></div>':''}<p>${r.desc.replace('\n','<br>')}</p><button class="door-button" id="closeRoom">거실로 돌아가기 <span>↗</span></button>`;detail.classList.add('active');document.querySelector('#roomBack').classList.add('show');statusText.textContent='03 — '+r.name;roomOpen=true;document.querySelector('#closeRoom').addEventListener('click',closeRoom)}));
function closeRoom(){detail.classList.remove('active');document.querySelector('#roomBack').classList.remove('show');roomOpen=false;statusText.textContent='02 — 거실'}document.querySelector('#roomBack').addEventListener('click',closeRoom);
window.addEventListener('pointermove',e=>{if(matchMedia('(pointer:fine)').matches){const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;frame.style.setProperty('--x',x.toFixed(3));frame.style.setProperty('--y',y.toFixed(3))}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(roomOpen)closeRoom();else if(!document.querySelector('#back').hidden)document.querySelector('#back').click()}});
</script></body></html>
